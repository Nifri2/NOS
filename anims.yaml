# Animation compilation configuration
# Each entry compiles source animation with specified settings
# Output files: <name>.animbyte -> animations/
#
# id: Protocol ID - must be unique
#     Embedded animations (embed: true) must have sequential IDs starting from 0
#     Logical animations (embed: false) can have any ID (used for side mapping)
#
# logical_id: If set, this animation is a variant of the logical animation
# side: left | right - which worker uses this variant (Worker_0=left, Worker_1=right)
#
# mirror_x: true - horizontal flip (left-right)
# mirror_y: true - vertical flip (top-bottom)

animations:
  # === Eye animations ===
  - name: eye_idle
    id: 0x00
    source: eye_idle.anim
    type: eye
    embed: true
    rotation: 90
    mirror_x: false
    mirror_y: false
    matrix_width: 16
    matrix_height: 16
    brightness: 0.2

  - name: eye_blink
    id: 0x01
    source: eye_blink.anim
    type: eye
    embed: true
    rotation: 90
    mirror_x: false
    mirror_y: false
    matrix_width: 16
    matrix_height: 16
    brightness: 0.2

  # === Mouth animations (with left/right variants) ===
  - name: mouth_idle_left
    id: 0x02
    logical_id: 0x10
    side: left
    source: mouth_idle.anim
    type: mouth
    embed: true
    rotation: 0
    mirror_x: false
    mirror_y: false
    matrix_width: 32
    matrix_height: 16
    brightness: 0.2

  - name: mouth_idle_right
    id: 0x03
    logical_id: 0x10
    side: right
    source: mouth_idle.anim
    type: mouth
    embed: true
    rotation: 180
    mirror_x: true
    mirror_y: false
    matrix_width: 32
    matrix_height: 16
    brightness: 0.2

  # === Boot animations (left/right variants) ===
  - name: boot_eye_left
    id: 0x04
    logical_id: 0x11
    side: left
    source: boot_eye.anim
    type: eye
    embed: true
    rotation: 90
    mirror_x: false
    mirror_y: false
    matrix_width: 16
    matrix_height: 16
    brightness: 0.2

  - name: boot_eye_right
    id: 0x05
    logical_id: 0x11
    side: right
    source: boot_eye.anim
    type: eye
    embed: true
    rotation: 90
    mirror_x: true
    mirror_y: false
    matrix_width: 16
    matrix_height: 16
    brightness: 0.2

  - name: boot_mouth_left
    id: 0x06
    logical_id: 0x12
    side: left
    source: boot_mouth.anim
    type: mouth
    embed: true
    rotation: 0
    mirror_x: false
    mirror_y: false
    matrix_width: 32
    matrix_height: 16
    brightness: 0.2

  - name: boot_mouth_right
    id: 0x07
    logical_id: 0x12
    side: right
    source: boot_mouth.anim
    type: mouth
    embed: true
    rotation: 180
    mirror_x: true
    mirror_y: false
    matrix_width: 32
    matrix_height: 16
    brightness: 0.2

  # === Reboot animations (left/right variants) ===
  - name: reboot_eye_left
    id: 0x08
    logical_id: 0x13
    side: left
    source: reboot_eye.anim
    type: eye
    embed: true
    rotation: 90
    mirror_x: false
    mirror_y: false
    matrix_width: 16
    matrix_height: 16
    brightness: 0.2

  - name: reboot_eye_right
    id: 0x09
    logical_id: 0x13
    side: right
    source: reboot_eye.anim
    type: eye
    embed: true
    rotation: 90
    mirror_x: true
    mirror_y: false
    matrix_width: 16
    matrix_height: 16
    brightness: 0.2

  - name: reboot_mouth_left
    id: 0x0A
    logical_id: 0x14
    side: left
    source: reboot_mouth.anim
    type: mouth
    embed: true
    rotation: 0
    mirror_x: false
    mirror_y: false
    matrix_width: 32
    matrix_height: 16
    brightness: 0.2

  - name: reboot_mouth_right
    id: 0x0B
    logical_id: 0x14
    side: right
    source: reboot_mouth.anim
    type: mouth
    embed: true
    rotation: 180
    mirror_x: true
    mirror_y: false
    matrix_width: 32
    matrix_height: 16
    brightness: 0.2

  # === Logical animations (for protocol, not embedded) ===
  - name: mouth_idle
    id: 0x10
    embed: false

  - name: boot_eye
    id: 0x11
    embed: false

  - name: boot_mouth
    id: 0x12
    embed: false

  - name: reboot_eye
    id: 0x13
    embed: false

  - name: reboot_mouth
    id: 0x14
    embed: false
