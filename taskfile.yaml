version: '3'

vars:
  # Change these variables to match your project
  TINYGO_TARGET: pico2

tasks:
  _build:
    internal: true
    cmds:
      # Gate the build on the pure-Go test suite. Cheap (~ms) and catches
      # protocol/reducer regressions before they reach a flash cycle.
      - task: test
      - |
        mkdir -p build
        echo "Building {{.ROLE}} ({{.ADDRESS}}) debug={{.DEBUG}}"
        TAGS=""
        if [ "{{.DEBUG}}" = "true" ]; then TAGS="-tags=debug"; fi
        tinygo build -o build/{{.ROLE}}-{{.ADDRESS}}.elf -target={{.TINYGO_TARGET}} \
          -scheduler=tasks \
          $TAGS \
          -ldflags="-X main.buildRole={{.ROLE}} -X main.buildAddress={{.ADDRESS}}" .

  _flash:
    internal: true
    cmds:
      - task: _build
        vars:
          ROLE: '{{.ROLE}}'
          ADDRESS: '{{.ADDRESS}}'
          DEBUG: '{{.DEBUG}}'
      - |
        TAGS=""
        if [ "{{.DEBUG}}" = "true" ]; then TAGS="-tags=debug"; fi
        tinygo flash -target={{.TINYGO_TARGET}} -scheduler=tasks $TAGS \
          -ldflags="-X main.buildRole={{.ROLE}} -X main.buildAddress={{.ADDRESS}}" . -monitor

  # Release builds
  build:dispatcher:
    desc: "Builds dispatcher firmware"
    cmds:
      - task: _build
        vars: {ROLE: dispatcher, ADDRESS: dispatch}

  build:worker-0:
    desc: "Builds worker-0 firmware"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-0}

  build:worker-1:
    desc: "Builds worker-1 firmware"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-1}

  build:worker-2:
    desc: "Builds worker-2 firmware"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-2}

  build:worker-3:
    desc: "Builds worker-3 firmware"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-3}

  build:hud:
    desc: "Builds OLED HUD firmware (runs on the Worker_2 board as a passive bus sniffer)"
    cmds:
      - task: _build
        vars: {ROLE: hud, ADDRESS: worker-2}

  build:all:
    desc: "Builds all firmwares"
    cmds:
      - task: build:dispatcher
      - task: build:worker-0
      - task: build:worker-1
      - task: build:worker-2
      - task: build:worker-3
      - task: build:hud

  # Debug builds (with verbose logging)
  build:dispatcher:debug:
    desc: "Builds dispatcher firmware with debug logging"
    cmds:
      - task: _build
        vars: {ROLE: dispatcher, ADDRESS: dispatch, DEBUG: "true"}

  build:worker-0:debug:
    desc: "Builds worker-0 firmware with debug logging"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-0, DEBUG: "true"}

  build:worker-1:debug:
    desc: "Builds worker-1 firmware with debug logging"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-1, DEBUG: "true"}

  build:worker-2:debug:
    desc: "Builds worker-2 firmware with debug logging"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-2, DEBUG: "true"}

  build:worker-3:debug:
    desc: "Builds worker-3 firmware with debug logging"
    cmds:
      - task: _build
        vars: {ROLE: worker, ADDRESS: worker-3, DEBUG: "true"}

  build:hud:debug:
    desc: "Builds OLED HUD firmware with debug logging"
    cmds:
      - task: _build
        vars: {ROLE: hud, ADDRESS: worker-2, DEBUG: "true"}

  build:all:debug:
    desc: "Builds all firmwares with debug logging"
    cmds:
      - task: build:dispatcher:debug
      - task: build:worker-0:debug
      - task: build:worker-1:debug
      - task: build:worker-2:debug
      - task: build:worker-3:debug

  # Flash tasks (release)
  flash:dispatcher:
    desc: "Flashes dispatcher firmware"
    cmds:
      - task: _flash
        vars: {ROLE: dispatcher, ADDRESS: dispatch}

  flash:worker-0:
    desc: "Flashes worker-0 firmware"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-0}

  flash:worker-1:
    desc: "Flashes worker-1 firmware"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-1}

  flash:worker-2:
    desc: "Flashes worker-2 firmware"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-2}

  flash:worker-3:
    desc: "Flashes worker-3 firmware"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-3}

  flash:hud:
    desc: "Flashes OLED HUD firmware (Worker_2 board)"
    cmds:
      - task: _flash
        vars: {ROLE: hud, ADDRESS: worker-2}

  # Flash tasks (debug)
  flash:dispatcher:debug:
    desc: "Flashes dispatcher firmware with debug logging"
    cmds:
      - task: _flash
        vars: {ROLE: dispatcher, ADDRESS: dispatch, DEBUG: "true"}

  flash:worker-0:debug:
    desc: "Flashes worker-0 firmware with debug logging"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-0, DEBUG: "true"}

  flash:worker-1:debug:
    desc: "Flashes worker-1 firmware with debug logging"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-1, DEBUG: "true"}

  flash:worker-2:debug:
    desc: "Flashes worker-2 firmware with debug logging"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-2, DEBUG: "true"}

  flash:worker-3:debug:
    desc: "Flashes worker-3 firmware with debug logging"
    cmds:
      - task: _flash
        vars: {ROLE: worker, ADDRESS: worker-3, DEBUG: "true"}

  flash:hud:debug:
    desc: "Flashes OLED HUD firmware with debug logging (Worker_2 board)"
    cmds:
      - task: _flash
        vars: {ROLE: hud, ADDRESS: worker-2, DEBUG: "true"}

  monitor:
    desc: "Attach Monitor to connected pi"
    cmds:
      - tinygo monitor

  compile_anims:
    desc: "Compile all animations using the settings in anims.yaml"
    cmds:
      - python helpers/compile_all.py

  generate_embeds:
    desc: "Update main.go with embed directives from anims.yaml"
    cmds:
      - python helpers/generate_embeds.py

  update_anims:
    desc: "Compile animations and update main.go embeds"
    cmds:
      - task: compile_anims
      - task: generate_embeds

  test:
    desc: "Run unit tests (pure-Go subset of cmd package)"
    cmds:
      # - go test ./cmd/
      - gotestsum --format dots -- -count=1 ./cmd/

  test:pretty:
    desc: "Run unit tests with colorized per-test output (needs gotestsum)"
    cmds:
      # gotestsum wraps `go test`; --format testname prints a PASS/FAIL line per
      # test plus a summary. -count=1 disables the test cache so every run is real.
      - gotestsum --format testname -- -count=1 ./cmd/

  generate_commit:
    desc: "Generate commit message with Claude, commit and push"
    cmds:
      - bash ./helpers/generate_commit.sh

  push_submodule:
    desc: "Commit and push compiler submodule changes, checkout main"
    cmds:
      - bash ./helpers/push_submodule.sh
